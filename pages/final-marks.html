<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Marks Calculator</title>

    <link rel="stylesheet" href="../style/final-marks.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <header class="header" id="header">
        <h1><i class="fa-solid fa-calculator"></i>Final Marks Calculator</h1>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="#">SGPA-Calculator</a></li>
            </ul>
        </nav>
    </header>
    <section id="body">
        <!-- left side -->
        <div class="input_side">
            <form>
                <h2><i class="fa-solid fa-pen"></i>Input Your Marks</h2>

                <label for="mid-term-marks">Mid-Term out of 100</label>
                <p>You have to input one subject marks (20-100) at a time like ART or CSE or ENV or ENG marks</p>

                <input type="number" value="" min="0" max="100" id="mid-term-marks" placeholder="Input Mid term marks">

                <label for="others-number">others out of 25</label>
                <p>You have to predict others mark (10-25). others like class tests, presentations, attendences etc.</p>
                <input type="number" value="" min="0" max="100" id="others-number" placeholder="Input others marks">

                <div class="submite-btn">Calculate</div> 

            </form>
        </div>

        <!-- right side -->
        <div class="output_side">
            <h1><i class="fa-solid fa-eye"></i> look Your Result</h1>
            <!-- show the number user need to get in final.It wiil be look big -->
            <p class="marks" id="show-marks">0 Marks</p>
            <!-- this massage complete 0 marks word -->
            <p id="massage-output" class="massage"></p>
        </div>
    </section>

    <script src="../js/script.js"></script>
</body>
</html>
